spring.application.name=trekconnect-auth-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.data.redis.repositories.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

jwt.issuer=trekconnect-auth-test
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
jwt.verification-token-expiration-ms=86400000
jwt.reset-token-expiration-ms=3600000
jwt.key-id=test-rs256-key-id

rabbitmq.exchange.auth=auth.exchange
rabbitmq.queue.user-registered=user.registered.queue
rabbitmq.routing-key.user-registered=user.registered
