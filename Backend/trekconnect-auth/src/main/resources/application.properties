server.port=8080
server.servlet.context-path=/
spring.application.name=trekconnect-auth

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JWT Token Expiration & Issuer Config
jwt.issuer=trekconnect-auth-service
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
jwt.verification-token-expiration-ms=86400000
jwt.reset-token-expiration-ms=3600000
jwt.key-id=trekconnect-auth-rs256-key-1

# RabbitMQ Messaging Parameters
rabbitmq.exchange.auth=auth.exchange
rabbitmq.queue.user-registered=user.registered.queue
rabbitmq.routing-key.user-registered=user.registered

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Structured Logging
logging.level.root=INFO
logging.level.com.trekconnect.auth=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [TraceId: %X{traceId:-}] %msg%n
