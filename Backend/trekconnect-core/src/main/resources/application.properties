server.port=8081
server.servlet.context-path=/
spring.application.name=trekconnect-core

# Main Database Configuration (PostgreSQL - main_db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/main_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Auth Service Base URL for JWKS Public Key Retrieval
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8080}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:true}

rabbitmq.exchange.auth=auth.exchange
rabbitmq.queue.user-registered=user.registered.queue
rabbitmq.routing-key.user-registered=user.registered

# Mail Configuration (SMTP Notifications)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply@trekconnect.com}
spring.mail.password=${SMTP_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator & Logging
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Razorpay Payments Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_trekconnect123}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_secret_trekconnect_key}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:whsec_trekconnect_secret}

logging.level.root=INFO
logging.level.com.trekconnect.core=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [TraceId: %X{traceId:-}] %msg%n
