server.port=8082
spring.application.name=trekconnect-ai

# TrekConnect Core Service URL for context enrichment
trekconnect.core.api-url=${CORE_API_URL:http://localhost:8081/api}

# TrekBot Ollama LLM Configuration
trekbot.model.name=TrekBot-Ollama-v2.0
trekbot.guardrails.enabled=true

# Ollama Local LLM Configuration (Llama 3.2, Mistral, Gemma)
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434}
ollama.model.name=${OLLAMA_MODEL:llama3.2:3b}
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:60000}

# KYC OCR Engine Configuration
kyc.ocr.min-confidence-threshold=70.0
kyc.ocr.name-match-threshold=80.0

# Actuator Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Multipart File Limits for KYC Document Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
