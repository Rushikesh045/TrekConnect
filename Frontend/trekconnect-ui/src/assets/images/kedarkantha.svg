<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#182235"/>
  <polygon points="0,500 250,120 500,380 750,140 800,500" fill="url(#kedGrad)" opacity="0.9"/>
  <!-- Snow caps -->
  <polygon points="250,120 220,170 280,170" fill="#ffffff"/>
  <polygon points="750,140 720,180 780,180" fill="#ffffff"/>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Kedarkantha Himalayan Snow Summit</text>
</svg>
