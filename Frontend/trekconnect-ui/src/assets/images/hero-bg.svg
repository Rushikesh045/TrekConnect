<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#101A2E"/>
      <stop offset="100%" stop-color="#182235"/>
    </linearGradient>
    <linearGradient id="mtnGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14CFA0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mtnGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#skyGrad)"/>
  <!-- Stars -->
  <circle cx="150" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="350" cy="120" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="700" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="950" cy="100" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="1100" cy="50" r="1.5" fill="#ffffff" opacity="0.7"/>
  <!-- Mountains -->
  <polygon points="0,600 200,320 450,520 700,280 950,480 1200,300 1200,600" fill="url(#mtnGrad1)"/>
  <polygon points="0,600 300,380 600,580 850,340 1150,520 1200,600" fill="url(#mtnGrad2)"/>
</svg>
